+name: Morning US Stocks Briefing
+
+on:
+  schedule:
+    # 22:30 UTC == 07:30 KST (next day)
+    - cron: "30 22 * * *"
+  workflow_dispatch: {}
+
+jobs:
+  run-briefing:
+    runs-on: ubuntu-latest
+
+    steps:
+      - name: Checkout
+        uses: actions/checkout@v4
+
+      - name: Setup Python
+        uses: actions/setup-python@v5
+        with:
+          python-version: "3.11"
+
+      - name: Validate required secrets
+        id: secrets_check
+        env:
+          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
+          GMAIL_USER: ${{ secrets.GMAIL_USER }}
+          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
+          MAIL_TO: ${{ secrets.MAIL_TO }}
+          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
+          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
+        run: |
+          missing=0
+          for key in OPENAI_API_KEY GMAIL_USER GMAIL_APP_PASSWORD MAIL_TO; do
+            if [ -z "${!key}" ]; then
+              echo "[Missing] $key"
+              missing=1
+            fi
+          done
+
+          if [ -z "$NEWS_API_KEY" ] && [ -z "$ALPHA_VANTAGE_API_KEY" ]; then
+            echo "[Missing] set NEWS_API_KEY or ALPHA_VANTAGE_API_KEY"
+            missing=1
+          fi
+
+          if [ "$missing" -eq 1 ]; then
+            echo "ready=false" >> "$GITHUB_OUTPUT"
+            echo "Secrets are missing. Skipping run to avoid hard failure."
+          else
+            echo "ready=true" >> "$GITHUB_OUTPUT"
+          fi
+
+      - name: Install dependencies
+        if: steps.secrets_check.outputs.ready == 'true'
+        run: pip install -r requirements.txt
+
+      - name: Run morning briefing
+        if: steps.secrets_check.outputs.ready == 'true'
+        env:
+          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
+          GMAIL_USER: ${{ secrets.GMAIL_USER }}
+          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
+          MAIL_TO: ${{ secrets.MAIL_TO }}
+          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
+          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
+        run: python main.py
